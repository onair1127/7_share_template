server:
     tomcat:
          max-keep-alive-requests: 0
          
     http2:
          enabled: true
          
     port: 8181
     shutdown: graceful

logging:
     charset:
          console: UTF-8

     level:
          com:
               anseong: DEBUG
          org:
               springframework:
                    core:
                         LocalVariableTableParameterNameDiscoverer: error

spring:
     output:
          ansi:
               enabled: always
     config:
          activate: 
               on-profile: proto

     datasource:
          url: ${SHARE_TEMPLATE_DB_URL}
          password: ${SHARE_TEMPLATE_DB_USERNAME}
          driver-class-name: ${SHARE_TEMPLATE_DB_PASSWORD}

          hikari:
               poolName: default
               maximum-pool-size: 1
               max-lifetime: 0

     jpa:
          open-in-view: false
          hibernate:
               ddl-auto: none
          properties:
               hibernate:
                    default_schema: anseong_food
                    enable_lazy_load_no_trans: true
                    # show_sql: true
                    # format_sql: true
                    jdbc:
                         batch_size: 100
                    query:
                         in_clause_parameter_padding: true